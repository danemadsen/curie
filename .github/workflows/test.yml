# Unit tests and lint for every change: pull requests to main, pushes to main and manual runs
name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to a pull request cancels the checks still running for the old one. Elsewhere a
# started run always finishes: the next one waits for it, replacing any older run still waiting
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # compileSdk 37, and the build tools AGP 9.5 defaults to
  ANDROID_PLATFORM: android-37.0
  BUILD_TOOLS_VERSION: 36.0.0
  TEST_REPORTS_RETENTION_DAYS: 7

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The version code counts the commits: fetch all of them, but only this revision's files
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.BUILD_TOOLS_VERSION }}
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and lint
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            engine/build/reports/
            engine/build/test-results/
            app/build/reports/
            app/build/test-results/
          retention-days: ${{ env.TEST_REPORTS_RETENTION_DAYS }}
